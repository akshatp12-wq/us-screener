# =============================================================================
# us-screener configuration. Every weight, threshold and universe setting
# lives here. Edit, commit, and the next scheduled run picks it up.
# Not investment advice.
# =============================================================================

meta:
  name: US Stock & ETF Screener
  repo: akshatp12-wq/us-screener
  pages_url: https://akshatp12-wq.github.io/us-screener/
  timezone: America/New_York

# ----------------------------------------------------------------------------- data
data:
  cache_dir: .cache            # raw downloads (restored by actions/cache in CI)
  out_dir: docs/data           # JSON written for the dashboard
  # SEC asks for a descriptive User-Agent with contact email, < 10 req/s.
  # Set the SEC_USER_AGENT secret, e.g. "Jane Doe jane@example.com".
  sec_user_agent_env: SEC_USER_AGENT
  sec_max_rps: 8
  default_max_rps: 4
  price_history_start: "2004-01-01"
  stale_after_hours:           # data-health warnings
    prices: 30
    fred: 120
    french: 1080
    shiller: 1080
    sec_fundamentals: 200
    insiders: 2400
    short_interest: 480
    ebp: 1500
    universe: 400
    etf_holdings: 200

sources:
  fred_csv: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"
  french_zip: "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/{name}_CSV.zip"
  shiller_xls: "http://www.econ.yale.edu/~shiller/data/ie_data.xls"
  shiller_page: "https://shillerdata.com/"
  ebp_csv: "https://www.federalreserve.gov/econres/notes/feds-notes/ebp_csv.csv"
  baker_wurgler_xlsx: "https://pages.stern.nyu.edu/~jwurgler/data/Investor_Sentiment_Data_20190327_POST.xlsx"
  sec_tickers: "https://www.sec.gov/files/company_tickers.json"
  sec_companyfacts: "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json"
  sec_companyfacts_bulk: "https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip"
  sec_daily_index: "https://www.sec.gov/Archives/edgar/daily-index/{year}/QTR{q}/form.{ymd}.idx"
  sec_form345: "https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/{yq}_form345.zip"
  sec_form345_alt: "https://www.sec.gov/files/datastandardsinnovation/data/insider-transactions-data-sets/{yq}_form345.zip"
  finra_short: "https://cdn.finra.org/equity/otcmarket/biweekly/shrt{ymd}.csv"
  stooq_daily: "https://stooq.com/q/d/l/?s={symbol}&i=d"
  ssga_holdings: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-{ticker}.xlsx"
  wiki_sp500: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  wiki_sp400: "https://en.wikipedia.org/wiki/List_of_S%26P_400_companies"
  wiki_sp600: "https://en.wikipedia.org/wiki/List_of_S%26P_600_companies"

# ----------------------------------------------------------------------------- universe
universe:
  indices: [sp500, sp400, sp600]      # S&P 1500
  min_price: 5.0
  min_dollar_volume: 5000000          # 63-day median daily dollar volume
  young_listing_years: 5

