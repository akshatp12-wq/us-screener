<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US Screener</title>
<meta name="description" content="Evidence-based US stock and ETF screener: market regime dials, factor rankings, model portfolios and historical validation. Not investment advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-row">
    <a class="brand" href="#regime">US Screener</a>
    <div class="updated" aria-live="polite">
      <span id="updated-label">Loading data…</span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch colour theme">◐</button>
    </div>
  </div>
  <p class="advice">Research tool, not investment advice. Backtests are hypothetical; past results don't predict future returns.</p>
</header>
<nav class="tabs-bar" aria-label="Pages"><div class="tabs">
    <a href="#regime" data-page="regime">Regime</a>
    <a href="#leads" data-page="leads">Leads</a>
    <a href="#bubbles" data-page="bubbles">Bubble watch</a>
    <a href="#stocks" data-page="stocks">Stocks</a>
    <a href="#etfs" data-page="etfs">ETFs</a>
    <a href="#portfolio" data-page="portfolio">Portfolio</a>
    <a href="#backtests" data-page="backtests">Backtests</a>
    <a href="#crashes" data-page="crashes">Crashes</a>
    <a href="#methodology" data-page="methodology">Methodology</a>
    <a href="#health" data-page="health">Data health</a>
</div></nav>
<main id="main" tabindex="-1">
  <div id="view" class="view"><p class="empty">Loading…</p></div>
</main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="xp-backdrop" class="xp-backdrop" hidden></div>
<aside id="xp" class="xp-panel" role="dialog" aria-modal="true" aria-labelledby="xp-title" hidden>
  <div class="xp-head">
    <h2 id="xp-title">Metric</h2>
    <button id="xp-close" class="icon-btn" type="button" aria-label="Close explanation">×</button>
  </div>
  <p id="xp-short" class="xp-short"></p>
  <div class="xp-tabs" role="tablist" aria-label="Explanation">
    <button type="button" role="tab" id="xp-tab-now" data-xptab="now" aria-controls="xp-now" aria-selected="true">What it says now</button>
    <button type="button" role="tab" id="xp-tab-bg" data-xptab="bg" aria-controls="xp-bg" aria-selected="false" tabindex="-1">Background &amp; evidence</button>
  </div>
  <div id="xp-body" class="xp-body">
    <div id="xp-now" role="tabpanel" aria-labelledby="xp-tab-now" tabindex="0"></div>
    <div id="xp-bg" role="tabpanel" aria-labelledby="xp-tab-bg" tabindex="0" hidden></div>
  </div>
</aside>
<script src="js/explain.js"></script>
<script src="js/app.js"></script>
</body>
</html>
