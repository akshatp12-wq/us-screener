name: Keep-alive

# GitHub disables scheduled workflows after 60 days without repository activity.
# Data commits normally keep the repo active; this is the safety net.
on:
  schedule:
    - cron: "17 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable the pipeline workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline.yml/enable" || true
      - name: Empty commit if the repo has been quiet for 40+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            git config user.name "screener-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive: prevent scheduled workflows from being disabled"
            git push
          else
            echo "Repository active within 40 days; nothing to do."
          fi
