name: Compare v1 vs v2

# Runs on pushes to the v2 branch: a full nightly + weekly build of v2 (written to preview/v2, not to
# the live dashboard data) and the side-by-side comparison (preview/v2/compare.json).
on:
  push:
    branches: [v2]
    paths-ignore: ["preview/**", "docs/data/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      PYTHONUNBUFFERED: "1"
      SCREENER_OUT: preview/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Build v2 (nightly + weekly)
        id: build
        continue-on-error: true
        run: python pipeline/run.py --job all
      - name: Compare
        id: cmp
        continue-on-error: true
        run: python pipeline/run.py --job compare
      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: data-${{ github.run_id }}
      - name: Commit preview
        run: |
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if ! git diff --cached --quiet; then
            git commit -q -m "preview: v2 build and comparison $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q && break; sleep $((i*5)); done
          fi
      - name: Fail if a stage failed
        if: steps.build.outcome == 'failure' || steps.cmp.outcome == 'failure'
        run: exit 1
