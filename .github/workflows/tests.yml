name: Tests

on:
  push:
    paths-ignore: ["docs/data/**", "preview/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests and offline end-to-end run (synthetic sources, no network)
        run: python -m pytest -q
      - name: Dashboard JavaScript syntax
        run: node --check docs/js/explain.js && node --check docs/js/app.js
